      THESIS: The editor is a dark studio and the screenshot is the only lit object in it;
      it refuses the docked-toolbar-plus-settings-form arrangement every screenshot tool ships.
      OWN-WORLD: Near-black room, floating smoked-glass slabs with a lit top edge, one amber
      accent, Archivo with Spline Sans Mono numerals, ambient light behind the canvas sampled from the user's
      own image. Separation by light and darkness, not by borders.
      STORY: A maker pastes a screenshot, sees the room take its colours, adjusts two or three
      controls by name, and exports.
      FIRST VIEWPORT: Glass command bar floating at top centre, glass inspector floating right
      with labelled tabs, glass tool bar floating bottom centre, and between them a lit canvas
      plate carrying a live sample so the tool is already working before the first paste.
      FORM: Studio glass, user-pinned over the roll (candidate 4 assigned), seed key 6f7ee73f.
      Raises: field ownership from the catalogue-sleeve world, explicit naming from the quoted
      industrial world, damped physical motion from the night-flight panel, light-not-borders
      separation from the phosphor world.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, and DESIGN.md.
    -->
